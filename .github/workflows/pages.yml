name: Deploy ClayTone v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind nonna2 custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f cname='nonna2.tanem.ru' \
            -f build_type='workflow'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore project files
        run: node scripts/restore-assets.mjs
      - run: npm ci
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Prepare static export
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
