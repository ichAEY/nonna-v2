name: Deploy ClayTone v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore project files
        run: node scripts/restore-assets.mjs
      - run: npm ci
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Prepare static export
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Diagnose nonna2 public page
        continue-on-error: true
        shell: bash
        run: |
          set -u
          echo "--- HEADERS ---"
          curl -sSIL --max-time 20 https://nonna2.tanem.ru/ || true
          echo "--- HTML HEAD ---"
          curl -sSL --max-time 20 https://nonna2.tanem.ru/ | head -c 5000 || true
          echo
          echo "--- ASSET STATUS ---"
          HTML=$(curl -sSL --max-time 20 https://nonna2.tanem.ru/ || true)
          printf '%s' "$HTML" | grep -oE '(src|href)="/[^"]+"' | sed -E 's/^(src|href)="([^"]+)"/\2/' | grep -E '^/(_next|assets)/' | head -n 12 | while read -r path; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://nonna2.tanem.ru${path}" || true)
            echo "$code $path"
          done
